id: co2
rules: [co2_warning, co2_critical]
title: "Повышенный CO₂ в модуле"
explain: "Средний уровень CO₂ за час выше 3 мм рт. ст. Возможны головная боль и снижение внимания."
steps:
  - "Сообщите командиру"
  - "Проверьте вентиляцию и систему удаления CO₂ в модуле"
  - "При головной боли — перейдите в другой модуль"
call: commander
recheck_after_s: 900
success: "co2_avg_1h <= 3.0"
escalate_if_not: crew
