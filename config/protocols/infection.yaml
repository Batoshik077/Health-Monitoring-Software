id: infection
rules: [fever, symptoms_infection]
title: "Признаки инфекции"
explain: "Температура выше нормы или отмечены симптомы инфекции. В полёте иммунитет ослаблен."
steps:
  - "Отметьте симптомы в дневнике"
  - "Сократите близкие контакты с экипажем"
  - "Пейте воду, отдыхайте"
  - "Сообщите бортовому медику"
call: cmo
recheck_after_s: 14400
success: "temp <= 37.5"
escalate_if_not: cmo
