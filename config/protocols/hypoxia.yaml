id: hypoxia
rules: [spo2_critical, spo2_warning]
title: "Низкий кислород в крови"
explain: "Насыщение крови кислородом (SpO₂) ниже нормы дольше 30 секунд."
steps:
  - "Проверьте, что датчик плотно прилегает и не сдвинут"
  - "Прекратите физическую нагрузку, сядьте или зафиксируйтесь"
  - "Проверьте O₂ и CO₂ в текущем модуле на экране «Корабль»"
  - "Если в модуле отклонения — перейдите в модуль с нормальной атмосферой"
  - "Позовите бортового медика"
call: cmo
recheck_after_s: 120
success: "spo2 >= 94"
escalate_if_not: commander
