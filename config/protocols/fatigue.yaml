id: fatigue
rules: [sleep_debt, readiness_low]
title: "Недосып и усталость"
explain: "Несколько ночей подряд сна меньше 6 часов, индекс готовности падает."
steps:
  - "Запланируйте сон не меньше 8 часов (плановая норма NASA — 8.5 ч)"
  - "Уберите яркий свет и экраны за час до сна"
  - "Перенесите сложные и опасные операции на после отдыха"
  - "Если не помогает 2 ночи подряд — обсудите с бортовым медиком"
call: cmo
recheck_after_s: 86400
success: "sleep_h >= 7"
escalate_if_not: cmo
