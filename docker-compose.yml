services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      ASTRO_SPEED: "1"
    volumes: ["astro-data:/data"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]

volumes:
  astro-data:
